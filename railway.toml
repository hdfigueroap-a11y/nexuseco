# railway.toml — Configuración del backend en Railway
# Ubicar en la raíz del repositorio o en /backend

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install"

[deploy]
startCommand = "cd backend && node src/config/migrate.js && node src/config/seed.js && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
